<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smartbits — Teste de Login</title>
<style>
  body { font-family: system-ui, sans-serif; background: #F6F3EA; color: #1D2430; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; border: 1px solid #D9D1BA; border-radius: 12px; padding: 34px; max-width: 440px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  .field-label { font-size: 11px; color: #7C7561; display: block; margin-bottom: 4px; }
  .field-input { width: 100%; padding: 8px; border: 1px solid #D9D1BA; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; font-size: 13px; }
  .device-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #EAE3D0; font-size: 12px; text-align: left; }
  .btn-small { font-size: 11px; padding: 5px 10px; background: #E08A2E; color: #fff; }
  h1 { font-size: 18px; margin-bottom: 6px; color: #153357; }
  p { font-size: 13px; color: #7C7561; margin-bottom: 24px; }
  button { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; }
  .btn-google { background: #153357; color: #fff; }
  .btn-logout { background: #F6F3EA; color: #1D2430; border: 1px solid #D9D1BA; margin-top: 14px; }
  .status { background: #E4EFEA; color: #2E6E5E; border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-bottom: 16px; word-break: break-all; }
  .error { background: #F5E2E1; color: #9E3A3F; }
  #app { display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Smartbits — Teste de Login</h1>
    <p>Página de teste para confirmar que o login com Google está ligado ao Supabase.</p>

    <div id="logged-out">
      <button class="btn-google" id="login-btn">Entrar com Google</button>
    </div>

    <div id="logged-in" style="display:none;">
      <div class="status" id="user-info"></div>
      <button class="btn-logout" id="logout-btn">Sair</button>

      <hr style="border:none;border-top:1px solid #D9D1BA;margin:22px 0;">
      <div style="text-align:left;">
        <p style="font-size:12px;color:#7C7561;margin-bottom:10px;">Pedir para entrar numa conta existente (teste da função signup-request)</p>
        <label style="font-size:11px;color:#7C7561;display:block;margin-bottom:4px;">Email do admin da conta</label>
        <input id="admin-email-input" type="email" placeholder="admin@exemplo.com"
          style="width:100%;padding:8px;border:1px solid #D9D1BA;border-radius:6px;margin-bottom:10px;box-sizing:border-box;font-size:13px;" />
        <label style="font-size:11px;color:#7C7561;display:block;margin-bottom:4px;">Nome deste aparelho</label>
        <input id="device-name-input" type="text" placeholder="Ex: Portátil da Direção"
          style="width:100%;padding:8px;border:1px solid #D9D1BA;border-radius:6px;margin-bottom:12px;box-sizing:border-box;font-size:13px;" />
        <button id="request-btn" class="btn-google" style="width:100%;justify-content:center;">Pedir para entrar</button>
        <div id="request-result" style="margin-top:10px;font-size:12px;"></div>
      </div>

      <div id="verify-section" style="display:none; text-align:left; margin-top:18px;">
        <hr style="border:none;border-top:1px solid #D9D1BA;margin:18px 0;">
        <p style="font-size:12px;color:#7C7561;margin-bottom:10px;">Já tens um código do admin? Introduz aqui</p>
        <label class="field-label">Código (ex: 123-456)</label>
        <input id="code-input" type="text" class="field-input" placeholder="000-000" />
        <button id="verify-btn" class="btn-google" style="width:100%;justify-content:center;">Confirmar código</button>
        <div id="verify-result" style="margin-top:10px;font-size:12px;"></div>
      </div>

      <div style="text-align:left; margin-top:18px;">
        <hr style="border:none;border-top:1px solid #D9D1BA;margin:18px 0;">
        <p style="font-size:12px;color:#7C7561;margin-bottom:10px;">Painel admin (teste) — pedidos pendentes</p>
        <button id="list-pending-btn" class="btn-logout" style="width:100%;justify-content:center;">Ver pedidos pendentes</button>
        <div id="pending-list" style="margin-top:10px;"></div>
      </div>
    </div>

    <div id="error-box" class="status error" style="display:none;"></div>
  </div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://jmpyzwsffbmbjxxfqecg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_hyQ83RqiogAVPl6-Wyc07g_RP8lzDs-';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentDeviceId = null;

  const loggedOutEl = document.getElementById('logged-out');
  const loggedInEl = document.getElementById('logged-in');
  const userInfoEl = document.getElementById('user-info');
  const errorBoxEl = document.getElementById('error-box');

  function showError(msg) {
    errorBoxEl.style.display = 'block';
    errorBoxEl.textContent = msg;
  }

  function renderUser(user) {
    if (user) {
      loggedOutEl.style.display = 'none';
      loggedInEl.style.display = 'block';
      userInfoEl.textContent = 'Sessão iniciada como: ' + user.email;
    } else {
      loggedOutEl.style.display = 'block';
      loggedInEl.style.display = 'none';
    }
  }

  // Check current session on load (handles the redirect back from Google)
  supabase.auth.getSession().then(({ data, error }) => {
    if (error) showError('Erro ao obter sessão: ' + error.message);
    renderUser(data?.session?.user ?? null);
  });

  supabase.auth.onAuthStateChange((_event, session) => {
    renderUser(session?.user ?? null);
  });

  document.getElementById('login-btn').addEventListener('click', async () => {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) showError('Erro ao iniciar login: ' + error.message);
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    renderUser(null);
  });

  document.getElementById('request-btn').addEventListener('click', async () => {
    const admin_email = document.getElementById('admin-email-input').value.trim();
    const device_name = document.getElementById('device-name-input').value.trim();
    const resultEl = document.getElementById('request-result');
    resultEl.style.color = '#7C7561';
    resultEl.textContent = 'A enviar...';

    const { data, error } = await supabase.functions.invoke('signup-request', {
      body: { admin_email, device_name }
    });

    if (error) {
      resultEl.style.color = '#9E3A3F';
      resultEl.textContent = 'Erro: ' + error.message;
    } else if (data?.error) {
      resultEl.style.color = '#9E3A3F';
      resultEl.textContent = 'Erro: ' + data.error;
    } else {
      resultEl.style.color = '#2E6E5E';
      resultEl.textContent = 'Pedido enviado! Estado: ' + data.status + ' (device_id: ' + data.device_id + ')';
      currentDeviceId = data.device_id;
      document.getElementById('verify-section').style.display = 'block';
    }
  });

  document.getElementById('verify-btn').addEventListener('click', async () => {
    const code = document.getElementById('code-input').value.trim();
    const resultEl = document.getElementById('verify-result');
    if (!currentDeviceId) {
      resultEl.style.color = '#9E3A3F';
      resultEl.textContent = 'Faz primeiro um "Pedir para entrar" acima, para teres um device_id.';
      return;
    }
    resultEl.style.color = '#7C7561';
    resultEl.textContent = 'A verificar...';

    const { data, error } = await supabase.functions.invoke('verify-device-code', {
      body: { device_id: currentDeviceId, code }
    });

    if (error) {
      resultEl.style.color = '#9E3A3F';
      resultEl.textContent = 'Erro: ' + error.message;
    } else if (data?.error) {
      resultEl.style.color = '#9E3A3F';
      resultEl.textContent = 'Erro: ' + data.error;
    } else {
      resultEl.style.color = '#2E6E5E';
      resultEl.textContent = 'Estado: ' + data.status + ' — aparelho aprovado!';
    }
  });

  document.getElementById('list-pending-btn').addEventListener('click', async () => {
    const listEl = document.getElementById('pending-list');
    listEl.textContent = 'A carregar...';
    const { data, error } = await supabase
      .from('devices')
      .select('id, device_name, user_id, status, created_at')
      .eq('status', 'pending')
      .order('created_at', { ascending: false });

    if (error) {
      listEl.textContent = 'Erro: ' + error.message;
      return;
    }
    if (!data || data.length === 0) {
      listEl.textContent = 'Nenhum pedido pendente (ou não és admin de nenhuma conta).';
      return;
    }
    listEl.innerHTML = '';
    data.forEach((d) => {
      const row = document.createElement('div');
      row.className = 'device-row';
      row.innerHTML = `<span>${d.device_name}</span>`;
      const btn = document.createElement('button');
      btn.className = 'btn-small';
      btn.textContent = 'Aprovar';
      btn.addEventListener('click', async () => {
        btn.textContent = '...';
        const { data: approveData, error: approveError } = await supabase.functions.invoke('approve-device', {
          body: { device_id: d.id }
        });
        if (approveError || approveData?.error) {
          row.innerHTML += `<span style="color:#9E3A3F;">${(approveError && approveError.message) || approveData.error}</span>`;
        } else {
          row.innerHTML = `<span>${d.device_name}</span><strong style="color:#2E6E5E;">Código: ${approveData.code}</strong>`;
        }
      });
      row.appendChild(btn);
      listEl.appendChild(row);
    });
  });
</script>
</body>
</html>
